<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrator Login</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#222}
form{width:100%;max-width:340px;margin:16px;padding:28px;background:#fff;border:1px solid #d6dbe3;border-radius:6px;box-shadow:0 2px 10px #0001}
h1{font-size:18px;margin:0 0 18px}
label{display:block;font-size:13px;margin:12px 0 5px}
input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #c5ccd6;border-radius:4px;font-size:14px}
button{width:100%;margin-top:18px;padding:10px;border:0;border-radius:4px;background:#2b5797;color:#fff;font-size:14px;cursor:pointer}
.err{margin-top:12px;font-size:13px;color:#b3261e}
</style>
</head>
<body>
<form method="post">
  <h1>Administrator Login</h1>
  <label for="u">Username</label><input id="u" name="username" autocomplete="off">
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="off">
  <button>Sign in</button>
  {% if error %}<div class="err">Invalid username or password.</div>{% endif %}
</form>
</body>
</html>
