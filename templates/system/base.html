<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>{% block title %}Tizim paneli{% endblock %} - AbExam</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#0f0f11;--surface:#18181b;--surface2:#1e1e23;--border:#2a2a32;
  --text:#e4e4e7;--muted:#71717a;--primary:#d32f2f;--primary-dark:#b71c1c;
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;
  --radius:12px;
}
body{font-family:-apple-system,'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
a{color:inherit}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.topbar-title .tag{background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.topbar a.back{color:var(--muted);font-size:13px;text-decoration:none}
.topbar a.back:hover{color:var(--text)}
.content{padding:28px;max-width:960px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.stat-val{font-size:18px;font-weight:700}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-green{background:#22c55e18;color:var(--green)}
.badge-red{background:#ef444418;color:var(--red)}
.badge-gray{background:#71717a18;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:#ef444418;color:var(--red);border:1px solid #ef444430}
.section-title{font-size:13px;font-weight:700;margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;background:var(--primary)}
.messages{margin-bottom:16px}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:8px}
.msg.success{background:#22c55e18;color:var(--green);border:1px solid #22c55e30}
.msg.error{background:#ef444418;color:var(--red);border:1px solid #ef444430}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title">🛠 Tizim paneli <span class="tag">Superuser</span></div>
  <a href="/panel/" class="back">← Admin panelga qaytish</a>
</div>
<div class="content">
  {% if messages %}
  <div class="messages">
    {% for message in messages %}
    <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
