<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joylashuv talab qilinadi</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f6f8;
        color: #171717;
      }
      main {
        width: min(440px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 28px;
        background: white;
        border: 1px solid #dfe2e7;
        border-radius: 8px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 0 0 18px;
        line-height: 1.55;
        color: #555;
      }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: #b91c1c;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      #status {
        min-height: 44px;
      }
      .error {
        color: #b91c1c !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Joylashuv talab qilinadi</h1>
      <p>
        Admin paneldan foydalanish uchun brauzerda joylashuv ruxsatini bering.
        Ruxsat bermasangiz panel ochilmaydi.
      </p>
      <p id="status" aria-live="polite"></p>
      <button id="request-location" type="button">Joylashuvni aniqlash</button>
    </main>
    <script>
      const status = document.getElementById('status');
      const button = document.getElementById('request-location');
      const nextUrl = "{{ next|escapejs }}";

      async function saveLocation(position) {
        button.disabled = true;
        status.className = '';
        status.textContent = 'Joylashuv saqlanmoqda...';
        try {
          const response = await fetch('/panel/location-required/', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            })
          });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error(result.error || 'Joylashuv saqlanmadi');
          window.location.assign(nextUrl);
        } catch (error) {
          button.disabled = false;
          status.className = 'error';
          status.textContent = error.message;
        }
      }

      function requestLocation() {
        status.className = '';
        status.textContent = 'Brauzer joylashuv ruxsatini kutmoqda...';
        if (!navigator.geolocation) {
          status.className = 'error';
          status.textContent = 'Bu brauzer joylashuvni qo‘llamaydi.';
          return;
        }
        navigator.geolocation.getCurrentPosition(saveLocation, error => {
          status.className = 'error';
          button.disabled = false;
          if (error.code === 1) {
            status.textContent = 'Joylashuv ruxsati rad etildi. Paneldan foydalanish uchun ruxsat bering.';
          } else if (error.code === 3) {
            status.textContent = 'Joylashuvni aniqlab bo‘lmadi. Iltimos, qayta urinib ko‘ring.';
          } else {
            status.textContent = 'Joylashuv mavjud emas yoki aniqlanmadi: ' + error.message;
          }
        }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
      }

      function getCookie(name) {
      const cookie = document.cookie.split('; ').find(value => value.startsWith(name + '='));
      return cookie ? decodeURIComponent(cookie.slice(name.length + 1)) : '';

      button.addEventListener('click', requestLocation);
      requestLocation();
    </script>
  </body>
</html>
