<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login tarixi</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 24px;
        background: #f6f6f6;
        color: #222;
      }
      a {
        color: #b91c1c;
      }
      main {
        max-width: 1100px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }
      th {
        background: #eee;
      }
      td {
        font-size: 13px;
      }
      .muted {
        color: #777;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Login tarixi</h1>
      <p><a href="{% url 'panel:users' %}">Foydalanuvchilar</a></p>
      <table>
        <thead>
          <tr>
            <th>Holat</th>
            <th>IP manzil</th>
            <th>Joylashuv</th>
            <th>Brauzer</th>
            <th>Vaqt</th>
          </tr>
        </thead>
        <tbody>
          {% for log in logs %}
          <tr>
            <td>{{ log.status }}</td>
            <td>{{ log.ip }}</td>
            <td>
              {{ log.latitude|default:'Saqlanmagan' }} {{
              log.longitude|default:'' }}
            </td>
            <td>{{ log.user_agent }}</td>
            <td>{{ log.created_at }}</td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="5" class="muted">Log yo'q</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </main>
  </body>
</html>
