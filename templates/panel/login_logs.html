<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login tarixi</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --panel: #fff;
        --line: #e5e7eb;
        --text: #17181b;
        --muted: #686d78;
        --red: #b91c1c;
        --blue: #2563eb;
      }
      .body {
        font-family: sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1180px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      .back {
        display: inline-block;
        margin-bottom: 18px;
        color: var(--red);
        text-decoration: none;
        font-weight: 600;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 820px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        font-size: 12px;
        color: var(--muted);
      }
      td {
        font-size: 13px;
      }
      .status {
        display: inline-flex;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
        background: #dcfce7;
        color: #166534;
      }
      .status.danger {
        background: #fee2e2;
        color: #991b1b;
      }
      .status.warning {
        background: #fef3c7;
        color: #92400e;
      }
      .ip,
      .time,
      .meta {
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      .location {
        font-weight: 700;
      }
      .maps {
        color: var(--blue);
        text-decoration: none;
      }
      .meta {
        color: var(--muted);
        margin-top: 4px;
        line-height: 1.5;
      }
      .empty {
        text-align: center;
        padding: 32px !important;
        color: var(--muted);
      }
      @media (max-width: 700px) {
        .wrap {
          margin: 12px auto;
        }
        .card {
          padding: 12px;
        }
        .device {
          display: none;
        }
        th:nth-child(4),
        td:nth-child(4) {
          display: none;
        }
        table {
          min-width: 650px;
        }
      }
    </style>
  </head>
  <body class="body">
    <div class="wrap">
      <div class="card">
        <h1>Login tarixi</h1>
        <a class="back" href="{% url 'panel:users' %}">Foydalanuvchilar</a>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Holat</th>
                <th>IP manzil</th>
                <th>Joylashuv</th>
                <th>Brauzer</th>
                <th>Vaqt</th>
              </tr>
            </thead>
            <tbody>
              {% for row in rows %}
              <tr>
                <td>
                  <span class="status {{ row.status_class }}"
                    >{{ row.status }}</span
                  >
                </td>
                <td class="ip">{{ row.ip }}</td>
                <td>{{ row.location_html }}</td>
                <td class="device meta">{{ row.user_agent }}</td>
                <td class="time">{{ row.created_at }}</td>
              </tr>
              {% empty %}
              <tr>
                <td colspan="5" class="empty">Login loglari yo'q</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
