{% extends 'base.html' %}

{% block title %}Darajani aniqlash - AbExam{% endblock %}
{% block page_title %}Darajani aniqlash{% endblock %}

{% block extra_css %}
<style>
    .pt { max-width: 640px; width: 100%; margin: 0 auto; }
    .pt-top { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .pt-top a { color: var(--text-muted); display: flex; padding: 6px; border-radius: 8px; }
    .pt-progress { flex: 1; height: 12px; background: var(--tint-b); border-radius: 6px; overflow: hidden; }
    .pt-progress div { height: 100%; width: 0; background: linear-gradient(90deg, #3b82f6, #2563eb); transition: width .3s; }
    .pt-lvl { font-size: 0.8rem; font-weight: 700; color: #3b82f6; min-width: 26px; }
    .pt-h { font-size: 1.4rem; font-weight: 600; margin-bottom: 18px; line-height: 1.4; }
    .pt-opts { display: grid; gap: 10px; }
    .pt-opt { text-align: left; background: var(--card-bg); border: 2px solid var(--border-color); border-bottom-width: 4px; border-radius: 14px; padding: 14px 16px; font-size: 1rem; color: var(--text-color); cursor: pointer; }
    .pt-opt:hover { border-color: #3b82f6; }
    .pt-skip { background: none; border: none; color: var(--text-muted); cursor: pointer; margin-top: 18px; font-size: .85rem; text-decoration: underline; }
    .pt-play { width: 76px; height: 76px; border-radius: 20px; border: none; background: #3b82f6; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 4px 0 #1d4ed8; }
    .pt-center { text-align: center; padding: 20px 0; }
    .pt-center .big { font-size: 3.6rem; }
    .pt-center p { color: var(--text-muted); margin: 8px auto 0; max-width: 460px; line-height: 1.6; }
    .pt-btn { display: inline-block; margin-top: 24px; padding: 14px 26px; border-radius: 14px; border: none; background: #22c55e; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none; box-shadow: 0 4px 0 #15803d; }
    .pt-badge { display: inline-block; font-size: 2.6rem; font-weight: 800; color: #3b82f6; border: 3px solid #3b82f6; border-radius: 18px; padding: 6px 22px; margin-top: 16px; }
</style>
{% endblock %}

{% block content %}
<div class="pt">
    <div class="pt-top">
        <a href="{% url 'learn:hub' %}" aria-label="Yopish"><i data-lucide="x" style="width:22px"></i></a>
        <div class="pt-progress"><div id="bar"></div></div>
        <div class="pt-lvl" id="lvl"></div>
    </div>
    <div id="stage"></div>
</div>
{{ test|json_script:"test-data" }}
{% endblock %}

{% block extra_js %}
<script>
(function () {
    const T = JSON.parse(document.getElementById('test-data').textContent);
    const CSRF = '{{ csrf_token }}';
    const stage = document.getElementById('stage');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const total = T.blocks.reduce((n, b) => n + b.questions.length, 0);
    const answers = {};
    let b = 0, q = 0, asked = 0;

    const speak = t => abSpeech.speak(t, { rate: 0.9 });

    function intro() {
        stage.innerHTML = `<div class="pt-center"><div class="big">🧭</div>
            <h2 class="pt-h" style="margin-top:12px">Ingliz tilingiz qaysi darajada?</h2>
            <p>Oson savollardan boshlab asta-sekin qiyinlashadi — ko'pi bilan ${total} ta savol, taxminan 3–4 daqiqa. Bilmasangiz, "Bilmayman"ni bosing: taxmin qilmang, shunda daraja aniqroq chiqadi.</p>
            <button class="pt-btn" id="go">Boshlash</button></div>`;
        document.getElementById('go').onclick = show;
    }

    function show() {
        const block = T.blocks[b], item = block.questions[q];
        document.getElementById('bar').style.width = (asked / total * 100) + '%';
        document.getElementById('lvl').textContent = block.level;
        stage.innerHTML = `
            ${item.audio ? `<button class="pt-play" id="play" aria-label="Tinglash"><i data-lucide="volume-2" style="width:30px"></i></button>` : ''}
            <h2 class="pt-h">${esc(item.q)}</h2>
            <div class="pt-opts">${item.options.map((o, i) => `<button class="pt-opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
            <button class="pt-skip" data-i="-1">Bilmayman</button>`;
        lucide.createIcons();
        if (item.audio) { document.getElementById('play').onclick = () => speak(item.say); setTimeout(() => speak(item.say), 300); }
        stage.querySelectorAll('[data-i]').forEach(el => el.onclick = () => choose(+el.dataset.i));
    }

    function choose(i) {
        (answers[b] = answers[b] || []).push(i);
        asked++;
        const block = T.blocks[b];
        if (++q < block.questions.length) return show();
        const right = answers[b].filter((a, k) => a === block.questions[k].answer).length;
        if (right >= (T.pass_mark || 4) && b + 1 < T.blocks.length) { b++; q = 0; return show(); }
        save();
    }

    async function save() {
        document.getElementById('bar').style.width = '100%';
        stage.innerHTML = `<div class="pt-center"><div class="big">⏳</div></div>`;
        const r = await fetch('{% url "learn:placement_save" %}', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF }, body: JSON.stringify({ answers }) });
        const d = await r.json();
        const why = {
            A1: "Asoslardan boshlaymiz: salomlashish, o'zingiz haqingizda gapirish. Tez o'sasiz!",
            A2: "Asosiy narsalarni bilasiz. Endi kundalik vaziyatlarda erkin gapirishni o'rganamiz.",
            B1: "Yaxshi poydevor bor! Endi fikr bildirish va murakkabroq grammatikaga o'tamiz.",
            B2: "Zo'r daraja! IELTS uchun akademik lug'at va strategiyalar ustida ishlaymiz.",
        };
        stage.innerHTML = `<div class="pt-center"><div class="big">🎯</div>
            <h2 class="pt-h" style="margin-top:12px">Sizga mos daraja</h2>
            <div class="pt-badge">${esc(d.level)}</div>
            <p>${why[d.level] || ''}</p>
            <a class="pt-btn" href="{% url 'learn:hub' %}?level=${encodeURIComponent(d.level)}">Darslarni boshlash →</a></div>`;
    }

    intro();
})();
</script>
{% endblock %}
