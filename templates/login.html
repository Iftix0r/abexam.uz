<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - AbExam</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="light">
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f7f9;
            --primary: #d32f2f;
            --secondary: #b71c1c;
            --text: #1c1c1e;
            --muted: #6b6b73;
            --glass: #ffffff;
            --border: rgba(0, 0, 0, 0.09);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 0% 0%, rgba(211, 47, 47, 0.1), transparent 40%),
                        radial-gradient(circle at 100% 100%, rgba(183, 28, 28, 0.1), transparent 40%);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 3rem 2rem;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            gap: 2px;
            margin-bottom: 2rem;
        }

        .logo-ab {
            color: #d32f2f;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-weight: 900;
            font-size: 2.5rem;
            line-height: 1;
        }

        .logo-exam {
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: -1px;
            font-size: 2rem;
            line-height: 1;
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 600;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .login-switch {
            display: block;
            margin: 8px 0 0 auto;
            background: none;
            border: 0;
            color: var(--muted);
            font: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            padding: 2px 0;
        }

        .login-switch:hover { color: var(--primary); }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 1rem;
            background: #f2f2f5;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(211, 47, 47, 0.05);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
            box-shadow: 0 10px 20px rgba(211, 47, 47, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(211, 47, 47, 0.4);
        }

        .footer-links {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
<link rel="stylesheet" href="/static/icons.css?v=9">
</head>
<body>
    <div class="login-card">
        <a href="/" class="logo">
            <span class="logo-ab">Ab</span>
            <span class="logo-exam">Exam</span>
        </a>
        
        <h2>Hisobingizga kiring</h2>

        {% if messages %}
        <div style="margin-bottom: 1rem;">
            {% for message in messages %}
            <div style="background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; color: #ef4444; margin-bottom: 8px;">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% if form.non_field_errors %}
        <div style="background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; color: #ef4444; margin-bottom: 1rem;">
            {{ form.non_field_errors.0 }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username" id="login-label">{% if username_login %}Login (username yoki telefon){% else %}Telefon raqam{% endif %}</label>
                <input id="id_username" name="username" required value="{{ form.username.value|default:'' }}"
                       autocapitalize="none" autocorrect="off" spellcheck="false"
                       {% if username_login %}type="text" autocomplete="username" placeholder="admin yoki +998 90 123 45 67"
                       {% else %}type="tel" autocomplete="tel" placeholder="+998 90 123 45 67"{% endif %}>
                <button type="button" class="login-switch" id="login-switch">{% if username_login %}<i class=lc-smartphone></i>&nbsp;Telefon raqam bilan kirish{% else %}<i class=lc-user></i>&nbsp;Username bilan kirish{% endif %}</button>
            </div>

            <div class="form-group">
                <label for="id_password">Parol</label>
                <input type="password" id="id_password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn">Tizimga kirish</button>
        </form>
        <script>
        // Phone keyboard for students; a letter keyboard for usernames (admins,
        // older accounts) — iPhone can't type letters into a tel field.
        (function () {
            const input = document.getElementById('id_username');
            const label = document.getElementById('login-label');
            const btn = document.getElementById('login-switch');
            btn.addEventListener('click', () => {
                const toText = input.type === 'tel';
                input.type = toText ? 'text' : 'tel';
                input.autocomplete = toText ? 'username' : 'tel';
                input.placeholder = toText ? 'admin yoki +998 90 123 45 67' : '+998 90 123 45 67';
                label.textContent = toText ? 'Login (username yoki telefon)' : 'Telefon raqam';
                btn.innerHTML = toText ? '<i class=lc-smartphone></i>&nbsp;Telefon raqam bilan kirish' : '<i class=lc-user></i>&nbsp;Username bilan kirish';
                input.focus();
            });
        })();
        </script>
        
        <div class="footer-links">
            Hisobingiz yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'tish</a>
        </div>
        <div class="footer-links" style="margin-top:8px">
            <a href="{% url 'password_reset' %}" style="color:var(--muted);font-size:13px">Parolni unutdingizmi?</a>
        </div>
    </div>
</body>
</html>
